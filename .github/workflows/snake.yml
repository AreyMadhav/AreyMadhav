name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Red Hacker Snake
        uses: Platane/snk@v3
        with:
          github_user_name: AreyMadhav
          outputs: |
            dist/snake-red.svg?palette=github-dark&color_snake=ff0033&color_dots=161b22,8b0000,ff0033,ff5555
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
